# Only needed if you deploy from the command line (npx wrangler deploy). The dashboard route doesn't use this file.
name = "alive-api"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
GITHUB_REPO = "detorotodorov-alexander/alive-app"
ALLOWED_ORIGIN = "https://detorotodorov-alexander.github.io"
TEXT_MODEL = "gpt-4o-mini"

# Secrets are NOT written here. Set them with:
#   npx wrangler secret put OPENAI_TRANSCRIBE_KEY
#   npx wrangler secret put OPENAI_TEXT_KEY
#   npx wrangler secret put GITHUB_TOKEN
